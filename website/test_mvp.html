<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayal Kore MVP Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🧪 Ayal Kore MVP Test</h1>
    <p>Testing basic functionality with mock data</p>

    <div class="test-section">
        <h3>1. Health Check</h3>
        <button onclick="testHealth()">Test Health</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>2. Stats Check</h3>
        <button onclick="testStats()">Test Stats</button>
        <div id="stats-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>3. Search Test</h3>
        <button onclick="testSearch()">Test Search</button>
        <div id="search-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>4. Upload Test (Mock)</h3>
        <input type="file" id="test-file" accept=".xlsx,.xls" />
        <button onclick="testUpload()">Test Upload</button>
        <div id="upload-result" class="result"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000';

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            try {
                const response = await fetch(`${API_BASE_URL}/`);
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testStats() {
            const resultDiv = document.getElementById('stats-result');
            try {
                const response = await fetch(`${API_BASE_URL}/stats`);
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testSearch() {
            const resultDiv = document.getElementById('search-result');
            try {
                const response = await fetch(`${API_BASE_URL}/search?column=שם&text=test`);
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testUpload() {
            const resultDiv = document.getElementById('upload-result');
            const fileInput = document.getElementById('test-file');

            if (!fileInput.files || fileInput.files.length === 0) {
                resultDiv.textContent = 'Please select a file first';
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
